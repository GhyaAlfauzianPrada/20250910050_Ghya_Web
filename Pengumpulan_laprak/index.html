<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kumpulan Modul PDF</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- HEADER -->
    <section class="pdf-header">

        <h1>
            📚 Kumpulan Modul PDF
        </h1>

        <p>
            Pilih modul untuk menampilkan file PDF.
        </p>

        <a href="../index.html"
           class="back-button">
            ← Kembali ke Home
        </a>

    </section>


    <!-- DAFTAR PDF -->
    <main class="pdf-container">

        <div class="pdf-list">

            <!-- MODUL 1 -->
            <div class="pdf-card">

                <div class="pdf-icon">
                    📄
                </div>

                <div class="pdf-info">

                    <h3>
                        Modul 1
                    </h3>

                    <p>
                        Laporan Praktikum Modul 1
                    </p>

                    <a href="pdf/modul1.pdf"
                       class="pdf-button"
                       target="pdf-viewer">
                        Tampilkan PDF
                    </a>

                </div>

            </div>


            <!-- MODUL 2 -->
            <div class="pdf-card">

                <div class="pdf-icon">
                    📄
                </div>

                <div class="pdf-info">

                    <h3>
                        Modul 2
                    </h3>

                    <p>
                        Laporan Praktikum Modul 2
                    </p>

                    <a href="pdf/modul2.pdf"
                       class="pdf-button"
                       target="pdf-viewer">
                        Tampilkan PDF
                    </a>

                </div>

            </div>


            <!-- MODUL 3 -->
            <div class="pdf-card">

                <div class="pdf-icon">
                    📄
                </div>

                <div class="pdf-info">

                    <h3>
                        Modul 3
                    </h3>

                    <p>
                        Laporan Praktikum Modul 3
                    </p>

                    <a href="pdf/Ghya_A.P._LAPRAK_WEBDESAIN_M3.pdf"
                       class="pdf-button"
                       target="pdf-viewer">
                        Tampilkan PDF
                    </a>

                </div>

            </div>

        </div>


        <!-- PDF VIEWER -->
        <section class="pdf-viewer-section">

            <h2>
                Tampilan PDF
            </h2>

            <iframe
                name="pdf-viewer"
                class="pdf-viewer"
                src="pdf/modul1.pdf">
            </iframe>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 GhyaWebsite | Kumpulan Modul PDF
        </p>

    </footer>

</body>
</html>
